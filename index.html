<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공모주 분석 캘린더</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
    .header { background: #fff; padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 17px; font-weight: 700; }
    .nav-btn { background: #f1f5f9; border: none; border-radius: 6px; width: 30px; height: 30px; font-size: 13px; cursor: pointer; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; padding: 8px 4px 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .weekdays div:first-child { color: #dc2626; }
    .weekdays div:last-child { color: #2563eb; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 2px; background: #e2e8f0; }
    .day-cell { background: #fff; min-height: 84px; padding: 4px 2px; display: flex; flex-direction: column; overflow: hidden; }
    .day-cell.today { background: #f0fdf4; }
    .day-num { font-size: 11px; font-weight: 600; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 2px; }
    .day-cell.today .day-num { background: #16a34a; color: #fff; }
    .chip { font-size: 9px; padding: 2px 3px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 500; }
    .chip.sub { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .chip.listing { background: #faf5ff; color: #9333ea; border: 1px solid #e9d5ff; }
    .chip.spac { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 100; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease-out; z-index: 101; }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 14px; }
    
    /* 신호등 배지 스타일 보완 */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge.green { background: #dcfce7; color: #15803d; }
    .badge.yellow { background: #fef9c3; color: #a16207; }
    .badge.red { background: #fee2e2; color: #b91c1c; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.green { background: #16a34a; }
    .dot.yellow { background: #ca8a04; }
    .dot.red { background: #dc2626; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .m-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .m-card .lbl { font-size: 11px; color: var(--text-muted); }
    .m-card .val { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .review { background: #f1f5f9; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f8fafc; }
    .row span:first-child { color: var(--text-muted); }
    .row span:last-child { font-weight: 600; }
    #updateTime { font-size: 10px; color: var(--text-muted); text-align: right; padding: 6px 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="monthTitle">로딩 중...</h1>
    <div style="display: flex; gap: 6px;">
      <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
      <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
  </div>
  <div id="updateTime"></div>
  <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="calendar" id="calendarGrid"></div>

  <!-- 바텀시트 -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h2 id="sName" style="font-size:18px; font-weight:700;"></h2>
        <div id="sUnderwriter" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
      <div id="sBadge" class="badge"></div>
    </div>
    <div class="metrics">
      <div class="m-card"><div class="lbl">기관경쟁률</div><div class="val" id="sInst"></div></div>
      <div class="m-card"><div class="lbl">일반청약경쟁률</div><div class="val" id="sGeneral"></div></div>
      <div class="m-card"><div class="lbl">의무보유확약</div><div class="val" id="sLockup"></div></div>
      <div class="m-card"><div class="lbl">유통가능금액</div><div class="val" id="sFloat"></div></div>
    </div>
    <div class="review" id="sReview"></div>
    <div class="row"><span>확정 공모가 / 상단여부</span><span id="sPrice" style="color:var(--primary);"></span></div>
    <div class="row"><span>청약 일정</span><span id="sPeriod"></span></div>
    <div class="row"><span>상장일</span><span id="sListing"></span></div>
  </div>

  <script>
    let stockData = [];
    const now = new Date();
    let curYear = now.getFullYear();
    let curMonth = now.getMonth() + 1;

    // KST 로컬 날짜 YYYY-MM-DD 변환
    function getFormattedDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // GitHub에 자동 생성되는 ipo_data.json 읽어오기
    async function loadData() {
      try {
        const res = await fetch('ipo_data.json?t=' + new Date().getTime()); // 캐시 방지
        if (res.ok) {
          const json = await res.json();
          stockData = json.stocks || [];
          if (json.updatedAt) {
            document.getElementById('updateTime').innerText = `최근 분석 업데이트: ${json.updatedAt}`;
          }
        }
      } catch (e) {
        console.log("데이터로드 실패 - 로컬/기본 모드로 실행됩니다.");
      }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById('monthTitle').innerText = `${curYear}년 ${curMonth}월`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
      const lastDate = new Date(curYear, curMonth, 0).getDate();
      const todayStr = getFormattedDate(new Date());

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell';
        empty.style.background = '#f8fafc';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        const dStr = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (dStr === todayStr) cell.classList.add('today');

        let html = `<div class="day-num">${d}</div>`;
        stockData.forEach(st => {
          const startDate = st.subStartDate || st.receiptDate;
          const endDate = st.subEndDate || st.receiptDate;
          const listDate = st.listingDate;

          if (startDate && endDate && dStr >= startDate && dStr <= endDate) {
            html += `<div class="chip ${st.isSpac ? 'spac' : 'sub'}" onclick="openSheet(event, '${st.id}')">청약: ${st.name}</div>`;
          } else if (listDate && dStr === listDate) {
            html += `<div class="chip listing" onclick="openSheet(event, '${st.id}')">상장: ${st.name}</div>`;
          }
        });
        cell.innerHTML = html;
        grid.appendChild(cell);
      }
    }

    function changeMonth(d) {
      curMonth += d;
      if (curMonth > 12) { curMonth = 1; curYear++; }
      if (curMonth < 1) { curMonth = 12; curYear--; }
      renderCalendar();
    }

    function openSheet(event, id) {
      if (event) event.stopPropagation();
      const st = stockData.find(s => s.id === id);
      if (!st) return;

      document.getElementById('sName').innerText = st.name + (st.isSpac ? " (스팩)" : "");
      document.getElementById('sUnderwriter').innerText = `주관사: ${st.underwriter || '공시문서 참조'}`;
      
      // 신호등 동그라미(🟢, 🟡, 🔴) 및 배지 연동
      const badge = document.getElementById('sBadge');
      const gradeText = st.grade === 'STRONG_BUY' ? '적극 추천' : st.grade === 'NEUTRAL' ? '선별 청약' : '주의/패스';
      const dotColor = st.grade === 'STRONG_BUY' ? 'green' : st.grade === 'NEUTRAL' ? 'yellow' : 'red';
      
      badge.innerHTML = `<span class="dot ${dotColor}"></span>${gradeText} (${st.score || 0}점)`;
      badge.className = `badge ${dotColor}`;

      // 수치 콤마(,) 서식 적용 및 지표 출력
      document.getElementById('sInst').innerText = st.institutionalRatio ? `${st.institutionalRatio.toLocaleString()}:1` : "미발표";
      document.getElementById('sGeneral').innerText = st.generalRatio ? `${st.generalRatio.toLocaleString()}:1` : "미발표";
      document.getElementById('sLockup').innerText = st.lockupRatio ? `${st.lockupRatio}%` : "0%";
      document.getElementById('sFloat').innerText = st.floatAmountBillion ? `${st.floatAmountBillion.toLocaleString()}억 원` : "미정";
      document.getElementById('sReview').innerText = st.summaryReview || st.reportTitle || "내용 없음";

      const priceText = st.price && st.price > 0 ? `${st.price.toLocaleString()}원` : "공시 참조";
      document.getElementById('sPrice').innerText = `${priceText} (${st.bandStatus || '미정'})`;
      
      const startDate = st.subStartDate || st.receiptDate || "-";
      const endDate = st.subEndDate || st.receiptDate || "-";
      document.getElementById('sPeriod').innerText = startDate === endDate ? startDate : `${startDate} ~ ${endDate}`;
      document.getElementById('sListing').innerText = st.listingDate || "미정";

      document.getElementById('overlay').style.display = 'block';
      document.getElementById('sheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('sheet').classList.remove('open');
    }

    loadData();
  </script>
</body>
</html>
