<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>공모주 분석 캘린더</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
    .header { background: #fff; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; gap: 8px; }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 6px; }

    /* 버튼 스타일 */
    .btn-update { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s, opacity 0.2s; }
    .btn-update:hover { background: #1d4ed8; }
    .btn-update:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-settings { background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; width: 30px; height: 30px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .nav-btn { background: #f1f5f9; border: none; border-radius: 6px; width: 30px; height: 30px; font-size: 13px; cursor: pointer; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; padding: 8px 4px 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .weekdays div:first-child { color: #dc2626; }
    .weekdays div:last-child { color: #2563eb; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 2px; background: #e2e8f0; }
    .day-cell { background: #fff; min-height: 84px; padding: 4px 2px; display: flex; flex-direction: column; overflow: hidden; }
    .day-cell.today { background: #f0fdf4; }
    .day-num { font-size: 11px; font-weight: 600; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 2px; }
    .day-cell.today .day-num { background: #16a34a; color: #fff; }
    .chip { font-size: 9px; padding: 2px 3px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-weight: 500; }
    .chip.sub { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .chip.listing { background: #faf5ff; color: #9333ea; border: 1px solid #e9d5ff; }
    
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 100; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s ease-out; z-index: 101; }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 14px; }
    
    /* 설정 모달 */
    .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; z-index: 102; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 16px; margin-bottom: 12px; }
    .modal label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .modal input { width: 100%; padding: 8px 10px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .modal .btn-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .modal button { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; cursor: pointer; font-weight: 600; }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge.blue { background: #eff6ff; color: #2563eb; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.blue { background: #2563eb; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
    .m-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .m-card .lbl { font-size: 11px; color: var(--text-muted); }
    .m-card .val { font-size: 12px; font-weight: 700; margin-top: 2px; word-break: break-all; }
    .review { background: #f1f5f9; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.5; color: #334155; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f8fafc; }
    .row span:first-child { color: var(--text-muted); }
    .row span:last-child { font-weight: 600; text-align: right; }
    .price-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .price-band { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .price-confirmed { font-weight: 700; color: var(--primary); }
    #updateTime { font-size: 11px; color: var(--text-muted); text-align: right; padding: 6px 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="monthTitle">로딩 중...</h1>
    <div class="header-actions">
      <!-- 🔄 업데이트 & ⚙️ 연동 설정 버튼 -->
      <button id="btnUpdate" class="btn-update" onclick="triggerGitHubAction()">🔄 업데이트</button>
      <button class="btn-settings" onclick="openConfigModal()" title="GitHub 연동 설정">⚙️</button>
      <div style="display: flex; gap: 4px;">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
      </div>
    </div>
  </div>
  <div id="updateTime"></div>
  <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="calendar" id="calendarGrid"></div>

  <!-- 설정 모달 -->
  <div class="modal" id="configModal">
    <h3>GitHub Actions 연동 설정</h3>
    <label>저장소 소유자 (GitHub ID)</label>
    <input type="text" id="cfgOwner" placeholder="예: hong-gildong">
    
    <label>저장소 이름 (Repository)</label>
    <input type="text" id="cfgRepo" placeholder="예: ipo-calendar">

    <label>워크플로우 파일명</label>
    <input type="text" id="cfgWorkflow" placeholder="예: main.yml 또는 auto-update.yml">

    <label>GitHub Personal Access Token (Classic)</label>
    <input type="password" id="cfgToken" placeholder="ghp_...">
    
    <div class="btn-group">
      <button style="background:#e2e8f0; color:#334155;" onclick="closeConfigModal()">취소</button>
      <button style="background:var(--primary); color:#fff;" onclick="saveConfig()">저장</button>
    </div>
  </div>

  <!-- 바텀시트 -->
  <div class="overlay" id="overlay" onclick="closeAll()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h2 id="sName" style="font-size:18px; font-weight:700;"></h2>
        <div id="sUnderwriter" style="font-size:12px; color:var(--text-muted); margin-top:2px;"></div>
      </div>
      <div id="sBadge" class="badge blue"><span class="dot blue"></span>종목 정보</div>
    </div>
    
    <div class="metrics">
      <div class="m-card"><div class="lbl">기관경쟁률</div><div class="val" id="sInst"></div></div>
      <div class="m-card"><div class="lbl">청약경쟁률</div><div class="val" id="sGeneral"></div></div>
      <div class="m-card"><div class="lbl">의무보유확약</div><div class="val" id="sLockup"></div></div>
    </div>
    
    <div class="review" id="sLinkBox">
      👉 상세보기: <a id="sLink" href="#" target="_blank" style="color:var(--primary); font-weight:bold; text-decoration:underline;">38커뮤니케이션 상세 페이지 이동</a>
    </div>

    <div class="row">
      <span>공모가 정보</span>
      <div class="price-group">
        <span id="sConfirmedPrice" class="price-confirmed"></span>
        <span id="sPriceBand" class="price-band"></span>
      </div>
    </div>
    <div class="row"><span>청약 일정</span><span id="sPeriod"></span></div>
    <div class="row"><span>환불일</span><span id="sRefund"></span></div>
    <div class="row"><span>상장일</span><span id="sListing"></span></div>
  </div>

  <script>
    let stockData = [];
    let lastUpdatedAt = "";
    const now = new Date();
    let curYear = now.getFullYear();
    let curMonth = now.getMonth() + 1;

    function getFormattedDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateString(dateStr, defaultYear) {
      if (!dateStr || dateStr === "미정") return null;
      const fullMatch = dateStr.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
      if (fullMatch) {
        return `${fullMatch[1]}-${fullMatch[2].padStart(2, '0')}-${fullMatch[3].padStart(2, '0')}`;
      }
      const shortMatch = dateStr.match(/(\d{1,2})[-./](\d{1,2})/);
      if (shortMatch) {
        return `${defaultYear}-${shortMatch[1].padStart(2, '0')}-${shortMatch[2].padStart(2, '0')}`;
      }
      return null;
    }

    function parseDateRange(dateStr, defaultYear) {
      if (!dateStr || dateStr === "미정") return { start: null, end: null };
      const fullMatches = [...dateStr.matchAll(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/g)];
      if (fullMatches.length >= 2) {
        return {
          start: `${fullMatches[0][1]}-${fullMatches[0][2].padStart(2, '0')}-${fullMatches[0][3].padStart(2, '0')}`,
          end: `${fullMatches[1][1]}-${fullMatches[1][2].padStart(2, '0')}-${fullMatches[1][3].padStart(2, '0')}`
        };
      }
      const shortMatches = [...dateStr.matchAll(/(\d{1,2})[-./](\d{1,2})/g)];
      if (shortMatches.length >= 2) {
        return {
          start: `${defaultYear}-${shortMatches[0][1].padStart(2, '0')}-${shortMatches[0][2].padStart(2, '0')}`,
          end: `${defaultYear}-${shortMatches[1][1].padStart(2, '0')}-${shortMatches[1][2].padStart(2, '0')}`
        };
      } else if (shortMatches.length === 1) {
        const dVal = `${defaultYear}-${shortMatches[0][1].padStart(2, '0')}-${shortMatches[0][2].padStart(2, '0')}`;
        return { start: dVal, end: dVal };
      }
      return { start: null, end: null };
    }

    async function loadData() {
      try {
        const res = await fetch('ipo_data.json?t=' + new Date().getTime());
        if (res.ok) {
          const json = await res.json();
          stockData = json.stocks || [];
          lastUpdatedAt = json.updatedAt || "";
          if (json.updatedAt) {
            document.getElementById('updateTime').innerText = `최근 분석 업데이트: ${json.updatedAt}`;
          }
        }
      } catch (e) {
        console.log("데이터 로드 실패 - JSON 데이터 확인 필요");
      }
      renderCalendar();
    }

    // --- GitHub Actions 수동 실행 트리거 ---
    async function triggerGitHubAction() {
      const owner = localStorage.getItem('gh_owner');
      const repo = localStorage.getItem('gh_repo');
      const workflow = localStorage.getItem('gh_workflow');
      const token = localStorage.getItem('gh_token');

      if (!owner || !repo || !workflow || !token) {
        alert("GitHub 연동 정보가 없습니다. ⚙️(설정) 아이콘을 눌러 정보를 먼저 등록해주세요.");
        openConfigModal();
        return;
      }

      const btn = document.getElementById('btnUpdate');
      btn.disabled = true;
      btn.innerText = "⏳ 요청 중...";

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/dispatches`;
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${token}`
          },
          body: JSON.stringify({ ref: 'main' }) // 기본 브랜치가 master인 경우 'master'로 자동 변경 필요시 수정
        });

        if (res.status === 204) {
          btn.innerText = "⚙️ 크롤링 중 (약 1분)...";
          // 8초 주기로 ipo_data.json 변경 여부 확인
          pollNewData(lastUpdatedAt);
        } else {
          const errData = await res.json().catch(() => ({}));
          alert(`실행 실패 (${res.status}): ${errData.message || '저장소 정보나 워크플로우 파일명을 확인해주세요.'}`);
          btn.disabled = false;
          btn.innerText = "🔄 업데이트";
        }
      } catch (err) {
        alert("요청 중 오류 발생: " + err.message);
        btn.disabled = false;
        btn.innerText = "🔄 업데이트";
      }
    }

    // 완료 감지 및 자동 새로고침 폴링
    function pollNewData(prevTime) {
      const btn = document.getElementById('btnUpdate');
      let attempts = 0;
      const maxAttempts = 25; // 최대 약 3분 대기

      const interval = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch('ipo_data.json?t=' + new Date().getTime());
          if (res.ok) {
            const json = await res.json();
            if (json.updatedAt && json.updatedAt !== prevTime) {
              clearInterval(interval);
              stockData = json.stocks || [];
              lastUpdatedAt = json.updatedAt;
              document.getElementById('updateTime').innerText = `최근 분석 업데이트: ${json.updatedAt}`;
              renderCalendar();
              btn.disabled = false;
              btn.innerText = "🔄 업데이트";
              alert(`🎉 업데이트 완료!\n총 ${stockData.length}개 종목이 갱신되었습니다.`);
              return;
            }
          }
        } catch (e) {}

        if (attempts >= maxAttempts) {
          clearInterval(interval);
          btn.disabled = false;
          btn.innerText = "🔄 업데이트";
          alert("업데이트 작업이 진행 중이거나 지연되고 있습니다. 잠시 후 새로고침해주세요.");
        }
      }, 8000);
    }

    // 설정 모달 열기/닫기/저장
    function openConfigModal() {
      document.getElementById('cfgOwner').value = localStorage.getItem('gh_owner') || '';
      document.getElementById('cfgRepo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('cfgWorkflow').value = localStorage.getItem('gh_workflow') || '';
      document.getElementById('cfgToken').value = localStorage.getItem('gh_token') || '';
      document.getElementById('overlay').style.display = 'block';
      document.getElementById('configModal').style.display = 'block';
    }

    function closeConfigModal() {
      document.getElementById('configModal').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    function saveConfig() {
      const owner = document.getElementById('cfgOwner').value.trim();
      const repo = document.getElementById('cfgRepo').value.trim();
      const workflow = document.getElementById('cfgWorkflow').value.trim();
      const token = document.getElementById('cfgToken').value.trim();

      if (!owner || !repo || !workflow || !token) {
        alert("모든 설정값을 빠짐없이 입력해주세요.");
        return;
      }

      localStorage.setItem('gh_owner', owner);
      localStorage.setItem('gh_repo', repo);
      localStorage.setItem('gh_workflow', workflow);
      localStorage.setItem('gh_token', token);

      alert("설정이 로컬 브라우저에 저장되었습니다.");
      closeConfigModal();
    }

    function closeAll() {
      closeConfigModal();
      closeSheet();
    }

    function renderCalendar() {
      document.getElementById('monthTitle').innerText = `${curYear}년 ${curMonth}월`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
      const lastDate = new Date(curYear, curMonth, 0).getDate();
      const todayStr = getFormattedDate(new Date());

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell';
        empty.style.background = '#f8fafc';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        const dStr = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (dStr === todayStr) cell.classList.add('today');

        let html = `<div class="day-num">${d}</div>`;
        
        stockData.forEach(st => {
          const subRange = parseDateRange(st.subDate, curYear);
          const listDateStr = parseDateString(st.listingDate, curYear);

          if (subRange.start && subRange.end && dStr >= subRange.start && dStr <= subRange.end) {
            html += `<div class="chip sub" onclick="openSheet(event, '${st.no}')">청약: ${st.name}</div>`;
          } else if (listDateStr && dStr === listDateStr) {
            html += `<div class="chip listing" onclick="openSheet(event, '${st.no}')">상장: ${st.name}</div>`;
          }
        });

        cell.innerHTML = html;
        grid.appendChild(cell);
      }
    }

    function changeMonth(d) {
      curMonth += d;
      if (curMonth > 12) { curMonth = 1; curYear++; }
      if (curMonth < 1) { curMonth = 12; curYear--; }
      renderCalendar();
    }

    function openSheet(event, no) {
      if (event) event.stopPropagation();
      const st = stockData.find(s => String(s.no) === String(no));
      if (!st) return;

      document.getElementById('sName').innerText = st.name;
      document.getElementById('sUnderwriter').innerText = `주관사: ${st.underwriter || '미확인'}`;
      
      document.getElementById('sInst').innerText = st.institutionalRatio || "0:1";
      document.getElementById('sGeneral').innerText = st.subscriptionRatio || "0:1";
      document.getElementById('sLockup').innerText = st.lockupRatio || "0.0%";

      const linkEl = document.getElementById('sLink');
      if (st.url) {
        linkEl.href = st.url;
        linkEl.style.display = 'inline';
      } else {
        linkEl.style.display = 'none';
      }

      const confEl = document.getElementById('sConfirmedPrice');
      const bandEl = document.getElementById('sPriceBand');

      if (st.confirmedPrice && st.confirmedPrice !== "미정") {
        confEl.innerText = `확정가: ${st.confirmedPrice}`;
      } else {
        confEl.innerText = "확정가: 미정";
      }

      if (st.priceBand && st.priceBand !== "미정") {
        bandEl.innerText = `희망밴드: ${st.priceBand}`;
      } else {
        bandEl.innerText = "희망밴드: 미정";
      }
      
      document.getElementById('sPeriod').innerText = st.subDate || "미정";
      document.getElementById('sRefund').innerText = st.refundDate || "미정";
      document.getElementById('sListing').innerText = st.listingDate || "미정";

      document.getElementById('overlay').style.display = 'block';
      document.getElementById('sheet').classList.add('open');
    }

    function closeSheet() {
      document.getElementById('sheet').classList.remove('open');
      document.getElementById('overlay').style.display = 'none';
    }

    loadData();
  </script>
</body>
</html>
