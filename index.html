<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국내 공모주 일정 및 정보 대시보드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- 상단 헤더 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-600">📈 국내 공모주 일정 대시보드</h1>
                <p class="text-sm text-gray-500 mt-1">38커뮤니케이션 데이터 기반 실시간 자동 업데이트</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span id="update-time" class="text-xs bg-blue-100 text-blue-800 px-3 py-1.5 rounded-full font-medium">데이터 로딩 중...</span>
            </div>
        </header>

        <!-- 요약 카드 영역 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">총 수집 종목</h3>
                <p id="total-count" class="text-3xl font-bold text-gray-800 mt-2">-</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">데이터 상태</h3>
                <p class="text-3xl font-bold text-green-600 mt-2">정상 동기화</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">소스 출처</h3>
                <p class="text-3xl font-bold text-indigo-600 mt-2">38 Communication</p>
            </div>
        </div>

        <!-- 데이터 테이블 영역 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="py-4 px-6">종목명</th>
                            <th class="py-4 px-6">희망공모가</th>
                            <th class="py-4 px-6">확정공모가</th>
                            <th class="py-4 px-6">청약일</th>
                            <th class="py-4 px-6">환불일</th>
                            <th class="py-4 px-6">상장일</th>
                            <th class="py-4 px-6 text-right">기관경쟁률</th>
                            <th class="py-4 px-6 text-right">의무보유확약</th>
                            <th class="py-4 px-6">주간사</th>
                        </tr>
                    </thead>
                    <tbody id="ipo-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- 데이터가 자바스크립트에 의해 동적으로 삽입됩니다 -->
                        <tr>
                            <td colspan="9" class="text-center py-8 text-gray-400">데이터를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 데이터 로딩 및 렌더링 스크립트 -->
    <script>
        async function loadIpoData() {
            try {
                // 동일 리포지토리 루트에 저장된 ipo_data.json 불러오기
                const response = await fetch('ipo_data.json');
                if (!response.ok) {
                    throw new Error('데이터 파일을 찾을 수 없습니다.');
                }
                const data = await response.json();

                // 상단 정보 업데이트
                document.getElementById('update-time').innerText = `최종 업데이트: ${data.updatedAt}`;
                document.getElementById('total-count').innerText = `${data.totalCount}개`;

                const tableBody = document.getElementById('ipo-table-body');
                tableBody.innerHTML = '';

                if (!data.stocks || data.stocks.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-400">등록된 공모주 데이터가 없습니다.</td></tr>`;
                    return;
                }

                // 종목 리스트 렌더링
                data.stocks.forEach(stock => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 transition-colors';

                    row.innerHTML = `
                        <td class="py-4 px-6 font-semibold text-gray-900">
                            <a href="${stock.url}" target="_blank" class="hover:text-blue-600 hover:underline flex items-center gap-1">
                                ${stock.name}
                                <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        </td>
                        <td class="py-4 px-6 text-gray-600">${stock.priceBand}</td>
                        <td class="py-4 px-6 font-medium text-blue-600">${stock.confirmedPrice}</td>
                        <td class="py-4 px-6 text-gray-600">${stock.subDate}</td>
                        <td class="py-4 px-6 text-gray-600">${stock.refundDate}</td>
                        <td class="py-4 px-6 text-gray-600">${stock.listingDate}</td>
                        <td class="py-4 px-6 text-right font-medium text-indigo-600">${stock.institutionalRatio}</td>
                        <td class="py-4 px-6 text-right text-gray-600">${stock.lockupRatio}</td>
                        <td class="py-4 px-6 text-gray-500 text-xs">${stock.underwriter}</td>
                    `;
                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('ipo-table-body').innerHTML = `
                    <tr><td colspan="9" class="text-center py-8 text-red-500">데이터를 불러오는 중 오류가 발생했습니다. (GitHub Actions가 아직 실행되지 않았거나 파일이 없을 수 있습니다)</td></tr>
                `;
            }
        }

        // 페이지 로드 시 데이터 호출
        loadIpoData();
    </script>
</body>
</html>
