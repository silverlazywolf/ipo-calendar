name: Auto Update IPO Data

on:
  schedule:
    # 💡 정각(00분) 부하 및 큐 지연을 피하기 위해 15분으로 설정
    # 한국 시간 기준: 매일 09:15, 14:15, 15:15
    # UTC 기준: 매일 00:15, 05:15, 06:15
    - cron: '15 0,5,6 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 rich urllib3

      # 💡 텔레그램 시크릿 환경변수를 전달하도록 env 추가
      - name: Run collector script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ipo_collector.py

      - name: Commit and push changes if ipo_data.json changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update IPO schedule data [skip ci]"
          file_pattern: "ipo_data.json"
