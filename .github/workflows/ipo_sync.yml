name: Auto Update IPO Data

on:
  schedule:
    # 💡 한국 시간 기준:
    # 1) 매일 08:50 (장 시작 전 상장 알림) -> UTC 23:50 (전날)
    # 2) 매일 14:15 (오후 데이터 중간 갱신) -> UTC 05:15
    # 3) 매일 15:00 (청약 마감 전 마지막날 알림) -> UTC 06:00
    - cron: '50 23 * * *'
    - cron: '15 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 rich urllib3

      - name: Run collector script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ipo_collector.py

      - name: Commit and push changes if ipo_data.json changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update IPO schedule data [skip ci]"
          file_pattern: "ipo_data.json"
