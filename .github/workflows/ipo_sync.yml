name: Auto Update IPO Data

on:
  schedule:
    # 한국 시간 기준: 매일 09:00, 14:00, 15:00 (UTC 00:00, 05:00, 06:00)
    - cron: '0 0,5,6 * * *'
  workflow_dispatch:

# 💡 이 부분을 추가해 줍니다.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 rich

      - name: Run collector script
        run: |
          python ipo_collector.py

      - name: Commit and push changes if ipo_data.json changed
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update IPO schedule data [skip ci]"
          file_pattern: "ipo_data.json"
