name: Update IPO Data

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC 기준) 자동 실행
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능

# 👇 [필수] GitHub Actions가 저장소에 접근하여 수정/푸시할 수 있도록 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Crawler
        run: python ipo_dart_crawler.py

      - name: Commit and push ipo_data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ipo_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPO data" && git push)
