name: Auto IPO Collector

on:
  schedule:
    # 매일 한국시간 오후 5시 30분 (UTC 오전 8시 30분) 자동 실행
    - cron: '30 8 * * *'
  # GitHub 사이트에서 버튼을 눌러 언제든 즉시 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 파이썬 수집 및 분석 실행
        run: python collector.py

      - name: 새로 분석된 ipo_data.json 저장 및 업로드
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ipo_data.json
          git commit -m "Update IPO Analysis Data" || echo "변경사항 없음"
          git push
